name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernel repository is read by `scripts/check-shapes.ts` to compare the TypeScript types
      # against the Rust ones. Without it the script skips those comparisons and says so, which means
      # a CI run without it would pass while checking less.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: synra-rs/synra-core
          path: synra-rust-core

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types first, because every other check reads the built declarations.
      - run: pnpm run check

      - run: pnpm run test

      - run: pnpm run lint

      # A generated file that was hand-edited shows up as a diff after a re-sync. This runs the
      # generator rather than the guard, because only the generator proves the two sides agree.
      - name: generated files are unmodified
        if: ${{ hashFiles('synra-rust-core/Cargo.toml') != '' }}
        run: |
          pnpm --filter @synra/protocol sync
          if [ -n "$(git status --porcelain packages/protocol/src/generated)" ]; then
            echo "::error::the generated protocol types are out of sync with the Rust crate"
            git --no-pager diff -- packages/protocol/src/generated
            exit 1
          fi